apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: __SVC__
  namespace: __SVC__
spec:
  parentRefs:
    - name: public-gateway
      namespace: istio-system
      sectionName: https-wildcard
  hostnames:
    - __HOSTNAME__
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: __SVC__
          port: 8080
